# Production stack: the two app containers, which publish NO ports. TLS and
# routing are handled by the VM's shared edge Caddy (site block in
# deploy/edge/sites/multiuavsar.caddy), which reaches them over the external
# Docker network "proxy" via the aliases sar-web and sar-backend. Create that
# network once per host: `docker network create proxy`.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Images are built and published by CI (see .github/workflows/ci.yml) rather than
# built here — a Next.js build peaks well above what a small box has spare, and
# building on the server is how a deploy turns into an OOM at the worst moment.
#
# Configuration lives in a .env file beside this one; start from .env.example.
services:
  backend:
    image: ghcr.io/${SAR_IMAGE_REPO:-kadircankara/multi-uav-sar}/backend:${SAR_IMAGE_TAG:-latest}
    # No ports: only the edge Caddy reaches this, over the proxy network.
    networks:
      default:
      proxy:
        aliases: [sar-backend]
    volumes:
      - ${SAR_DATA_DIR:-/opt/sar/Results}:/app/Results
    environment:
      # Same origin, so CORS is inert. Kept explicit so that a future split
      # deployment fails loudly rather than silently allowing localhost.
      SAR_CORS_ORIGINS: https://${SAR_DOMAIN}
      # Caddy is the only thing that talks to this container; trust its
      # forwarded headers so per-IP limits see the real client.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      # One BLAS thread per process. Unset, OpenBLAS sizes its pool from the
      # host's core count, so every optimizer child and every threadpool replay
      # would each claim all the cores — N workers x N cores of oversubscription,
      # which costs more in context switching than the threads ever win back.
      # backend/scripts/*.py already do this for the batch tooling; the serving
      # path needs it too, and more so as SAR_OPTIMIZE_WORKERS grows. Container
      # env is set before the interpreter starts, which is the requirement:
      # these are read by OpenBLAS at import, so setting them later has no
      # effect.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      SAR_OPTIMIZE_WORKERS: ${SAR_OPTIMIZE_WORKERS:-2}
      SAR_OPTIMIZE_QUEUE_MAX: ${SAR_OPTIMIZE_QUEUE_MAX:-8}
      SAR_OPTIMIZE_MAX_PER_CLIENT: ${SAR_OPTIMIZE_MAX_PER_CLIENT:-1}
      SAR_SELECTOR_CACHE_SIZE: ${SAR_SELECTOR_CACHE_SIZE:-6}
      SAR_MAX_N_VISITS: ${SAR_MAX_N_VISITS:-3}
      SAR_MAX_CELL_SIDE_LENGTH: ${SAR_MAX_CELL_SIDE_LENGTH:-1000}
      SAR_MIN_DRONE_SPEED: ${SAR_MIN_DRONE_SPEED:-0.1}
      SAR_MAX_POP_SIZE: ${SAR_MAX_POP_SIZE:-300}
      SAR_MAX_N_GEN: ${SAR_MAX_N_GEN:-1000}
      SAR_OPTIMIZE_RATE_LIMIT: ${SAR_OPTIMIZE_RATE_LIMIT:-30/minute}
      SAR_REPLAY_RATE_LIMIT: ${SAR_REPLAY_RATE_LIMIT:-60/minute}
      SAR_COMPARISON_RATE_LIMIT: ${SAR_COMPARISON_RATE_LIMIT:-10/minute}
      SAR_COMPARISON_CONCURRENCY: ${SAR_COMPARISON_CONCURRENCY:-2}
      SAR_COMPARISON_MAX_SCENARIOS: ${SAR_COMPARISON_MAX_SCENARIOS:-40}
      SAR_COMPARISON_TIME_BUDGET_SECONDS: ${SAR_COMPARISON_TIME_BUDGET_SECONDS:-15}
      SAR_HEAVY_CONCURRENCY: ${SAR_HEAVY_CONCURRENCY:-3}
      # Bound the temp .runs/ tree so it cannot fill the volume.
      SAR_OPTIMIZE_RUN_KEEP: ${SAR_OPTIMIZE_RUN_KEEP:-40}
      SAR_RUN_PURGE_INTERVAL_SECONDS: ${SAR_RUN_PURGE_INTERVAL_SECONDS:-900}
      SAR_LOG_LEVEL: ${SAR_LOG_LEVEL:-INFO}
    restart: unless-stopped
    # Give in-flight runs and the shutdown sweep a defined window before SIGKILL,
    # so a deploy does not truncate a run pickle mid-write.
    stop_grace_period: 30s
    # Runs as the unprivileged appuser (uid 1000) already; drop the rest of the
    # container's power and cap process count against a fork storm.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # A ceiling so a runaway backend cannot take the whole box down with
          # it — the container dies and restarts instead of the kernel picking
          # a victim. Raise together with SAR_SELECTOR_CACHE_SIZE.
          memory: ${SAR_BACKEND_MEMORY_LIMIT:-2600m}
          # Cap process count against a fork storm (optimizer children + main).
          pids: 512

  web:
    image: ghcr.io/${SAR_IMAGE_REPO:-kadircankara/multi-uav-sar}/web:${SAR_IMAGE_TAG:-latest}
    networks:
      default:
      proxy:
        aliases: [sar-web]
    restart: unless-stopped
    # Lets `docker compose up --wait` and rollouts know when the UI is ready.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 256

networks:
  proxy:
    external: true
