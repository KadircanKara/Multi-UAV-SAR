name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      # Seeded Results/ data is not in the repo; data-dependent tests
      # detect the absence and skip themselves.
      - run: pytest tests backend/tests

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Unset on purpose: exercises the same-origin (relative URL) build that
      # production ships.
      - run: npm run build

  # Pull requests only prove the images build. Pushes to main additionally
  # publish them, so the server pulls a tested artifact instead of compiling on
  # a box with barely enough RAM to do it.
  docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically by Actions — no secret to configure.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: names
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/$repo/backend" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$repo/web" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build -f backend/Dockerfile \
            -t "${{ steps.names.outputs.backend }}:latest" \
            -t "${{ steps.names.outputs.backend }}:${{ github.sha }}" .

      # No NEXT_PUBLIC_API_BASE: the image defaults to same-origin relative
      # URLs, which is what the production stack serves. Baking a domain in
      # here would make the artifact environment-specific.
      - name: Build web image
        run: |
          docker build \
            -t "${{ steps.names.outputs.web }}:latest" \
            -t "${{ steps.names.outputs.web }}:${{ github.sha }}" web

      - name: Push images
        if: github.event_name == 'push'
        run: |
          docker push --all-tags "${{ steps.names.outputs.backend }}"
          docker push --all-tags "${{ steps.names.outputs.web }}"
