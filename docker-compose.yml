# Local/staging production-shaped stack.
#
#   docker compose up --build
#
# Frontend on http://localhost:3000, backend on http://localhost:8000.
# Overrides (e.g. a real deploy) go in a .env file next to this one — see
# "Production notes" in README.md. NEXT_PUBLIC_API_BASE must be the URL the
# BROWSER uses to reach the backend, and it is baked in at image build time.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Seeded mission data, provisioned on the host (see README).
      - ./Results:/app/Results
    environment:
      SAR_CORS_ORIGINS: ${SAR_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SAR_OPTIMIZE_RATE_LIMIT: ${SAR_OPTIMIZE_RATE_LIMIT:-30/minute}
      SAR_REPLAY_RATE_LIMIT: ${SAR_REPLAY_RATE_LIMIT:-60/minute}
      # Optimizer pool: one child process per concurrent run, each pinning one
      # core. Keep at or below (cores - 1) so replays keep a core to run on.
      SAR_OPTIMIZE_WORKERS: ${SAR_OPTIMIZE_WORKERS:-2}
      SAR_OPTIMIZE_QUEUE_MAX: ${SAR_OPTIMIZE_QUEUE_MAX:-8}
      SAR_OPTIMIZE_MAX_PER_CLIENT: ${SAR_OPTIMIZE_MAX_PER_CLIENT:-2}
      # Per-run cost ceilings — these bound how long one run holds a worker.
      # n_visits is the biggest multiplier of the three.
      SAR_MAX_N_VISITS: ${SAR_MAX_N_VISITS:-3}
      SAR_MAX_POP_SIZE: ${SAR_MAX_POP_SIZE:-300}
      SAR_MAX_N_GEN: ${SAR_MAX_N_GEN:-1000}
      # Behind a proxy/ALB set this to the proxy IP/CIDR; never '*'.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
